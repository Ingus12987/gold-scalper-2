name: Validate C on held-out XAUT history (DEMO)
on:
  push:
    paths:
      - 'backtest_gold_profit_auto.py'
      - 'fetch_gold_history.py'
      - '.github/workflows/validate-c-paper.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: gold-demo-research
  cancel-in-progress: false
jobs:
  validate-c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download public candles (no trading)
        run: python fetch_gold_history.py
      - name: Repeat independent DEMO validation (never places orders)
        run: echo 'Scheduled research run; baseline remains unchanged'
      - name: Fresh signal EMA strength comparison (DEMO)
        run: |
          python -u backtest_gold_profit_auto.py gold_history_1m.csv --test-fresh-ema-gap
