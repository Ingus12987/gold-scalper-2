name: H3 DEMO ER30 session research
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - research/h3-er-session-demo-20261122
permissions:
  contents: read
  actions: read
jobs:
  h3-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Restore pinned public XAUT candles (no orders)
        uses: actions/download-artifact@v4
        with:
          name: xaut-1m-input-45264961940
          run-id: 45264961940
          github-token: ${{ github.token }}
      - name: Verify exact raw CSV SHA256 before research
        run: echo '9ede7188b356b639403db3af3cbcbac578dda15fd9ed0ab4484517dd295146a5  gold_history_1m.csv' | sha256sum --check
      - name: Archive exact input for reproducible follow-up
        uses: actions/upload-artifact@v4
        with:
          name: xaut-1m-input-${{ github.run_id }}
          path: gold_history_1m.csv
          retention-days: 30
          if-no-files-found: error
      - name: Train and validation only, with cost stress
        run: python -u research_h3_er_session.py gold_history_1m.csv

      - name: Isolated TRAIN-only LONG trend gate and SHORT regression
        run: python -u research_long_15m_ema50_train.py gold_history_1m.csv
