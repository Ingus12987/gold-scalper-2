name: Gold historical PAPER backtest
on:
  push:
    paths:
      - '.github/workflows/gold_backtest.yml'
      - 'fetch_gold_history.py'
      - 'backtest_gold_profit_auto.py'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download public XAUT-USDT candles
        run: python fetch_gold_history.py
      - name: Historical PAPER backtest (no orders)
        run: python backtest_gold_profit_auto.py gold_history_1m.csv --compare
      - name: Upload data for audit
        uses: actions/upload-artifact@v4
        with:
          name: xaut-usdt-1m-history
          path: gold_history_1m.csv
          retention-days: 7
