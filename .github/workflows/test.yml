name: Test dual paper bots
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile dual_demo.py test_dual_demo.py
      - name: Run unit tests
        run: python -m unittest -v test_dual_demo.py
